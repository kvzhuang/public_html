<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板塊飄移 · Plate Drift — 大陸漂移前後對照 gen-art</title>
<meta name="description" content="以 D3.js 正射投影繪製的可旋轉 3D 地球，讓各大陸依真實 Euler 旋轉極漂移，灰白虛線＝現今位置、彩色實體＝漂移後，正放看未來、倒放看過去。">
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#cdd6e6;
    font-family:-apple-system,"Noto Sans TC",sans-serif;overflow:hidden;}
  #globe{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none;}
  #globe:active{cursor:grabbing;}
  #title{position:fixed;top:14px;left:16px;pointer-events:none;text-shadow:0 2px 10px #000;}
  #title h1{margin:0;font:700 17px/1.2 "Noto Serif TC",Georgia,serif;letter-spacing:.06em;color:#e8eefc;}
  #title small{color:#7f90b5;font-size:11px;letter-spacing:.12em;}
  #hud{position:fixed;top:16px;right:16px;text-align:right;pointer-events:none;text-shadow:0 2px 8px #000;}
  #hud .t{font:700 22px/1 ui-monospace,monospace;color:#ffd27f;}
  #hud .sub{font-size:11px;color:#7f90b5;margin-top:3px;}
  #panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
    background:rgba(14,20,34,.82);border:1px solid #26324e;border-radius:12px;
    padding:10px 14px;backdrop-filter:blur(6px);max-width:94vw;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  #panel button{background:#1c2740;color:#cfe0ff;border:1px solid #35476e;border-radius:8px;
    padding:7px 12px;font-size:13px;cursor:pointer;min-width:40px;}
  #panel button:hover{background:#26355a;}
  #panel button.on{background:#2f6df0;border-color:#5b8cff;color:#fff;}
  #panel label{font-size:12px;color:#9fb0d4;display:flex;align-items:center;gap:7px;}
  #speed{width:150px;accent-color:#2f6df0;}
  .sw{display:flex;align-items:center;gap:5px;font-size:12px;color:#9fb0d4;}
  #legend{position:fixed;left:16px;bottom:80px;font-size:11px;color:#8fa0c4;
    line-height:1.8;text-shadow:0 1px 4px #000;pointer-events:none;max-width:46vw;}
  #legend b{color:#cdd6e6;}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;background:#05070d;z-index:50;color:#8fa3c8;font-size:14px;}
  #loading .bar{width:180px;height:3px;background:#1c2740;border-radius:2px;overflow:hidden;}
  #loading .bar i{display:block;height:100%;width:40%;background:#2f6df0;animation:load 1.1s infinite;}
  @keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}
  #err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:#05070d;z-index:60;color:#e88;font-size:14px;line-height:1.7;}
  @media(max-width:640px){#legend{display:none}#title h1{font-size:15px}#speed{width:110px}}
</style>
</head>
<body>
<canvas id="globe"></canvas>
<div id="title"><h1>板塊飄移 · Plate Drift</h1><small>CONTINENTAL DRIFT — PAST · PRESENT · FUTURE</small></div>
<div id="hud"><div class="t" id="ttime">0.0 Myr</div><div class="sub" id="tsub">現今 present day</div></div>
<div id="legend">
  🌐 拖曳旋轉地球<br>
  <b style="color:#9fb0d4">灰白虛線</b>＝大陸<b>現今</b>位置　·　<b>彩色實體</b>＝<b>漂移後</b>位置<br>
  ▶ 正放看未來、◀ 倒放看過去 —— 大陸沿板塊運動漂移
</div>
<div id="panel">
  <button id="back" title="倒放（過去）">◀</button>
  <button id="play" class="on" title="播放/暫停">⏸</button>
  <button id="fwd" class="on" title="正放（未來）">▶</button>
  <label>速度 <input type="range" id="speed" min="0" max="20" step="0.5" value="4"><span id="spv">4.0</span> Myr/s</label>
  <button id="reset" title="回到現今">⟳ 現今</button>
  <label class="sw"><input type="checkbox" id="tgGhost" checked> 現今對照</label>
  <label class="sw"><input type="checkbox" id="tgPlates"> 板塊界</label>
  <label class="sw"><input type="checkbox" id="tgParticles"> 粒子</label>
  <label class="sw"><input type="checkbox" id="tgSpin" checked> 自轉</label>
</div>
<div id="loading"><div>載入地圖與板塊資料中…</div><div class="bar"><i></i></div></div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
"use strict";
const DEG = Math.PI/180;

// 主要板塊絕對運動 Euler 極（lat°, lon°, ω°/Myr；NNR-MORVEL56 近似值）
const EULER = {
  PA:[-63.6,114.7,0.65], NA:[-4.9,-80.6,0.21], SA:[-22.6,-112.8,0.11],
  AF:[47.7,-68.4,0.29],  EU:[48.9,-106.5,0.22], AN:[65.4,-118.1,0.25],
  AU:[33.9,38.0,0.63],   IN:[50.4,-3.3,0.54],   AR:[48.9,-8.5,0.56],
  NZ:[46.2,-101.1,0.70], CO:[26.9,-124.3,1.20], CA:[35.2,-92.6,0.29],
  PS:[-38.1,60.2,0.90],  JF:[0.6,37.4,0.95],    SC:[48.6,-30.0,0.15],
  SO:[49.8,-73.5,0.30],  SU:[50.1,-95.0,0.34],
};
const NAME2CODE = {
  'Pacific':'PA','North America':'NA','South America':'SA','Africa':'AF',
  'Eurasia':'EU','Antarctica':'AN','Australia':'AU','India':'IN','Arabia':'AR',
  'Nazca':'NZ','Cocos':'CO','Caribbean':'CA','Philippine Sea':'PS',
  'Juan de Fuca':'JF','Scotia':'SC','Somalia':'SO','Sunda':'SU','Sundaland':'SU',
};

// 3D 向量工具（球面單位向量）
function ll2v(lon,lat){const a=lat*DEG,b=lon*DEG,c=Math.cos(a);return [c*Math.cos(b),c*Math.sin(b),Math.sin(a)];}
function v2ll(v){return [Math.atan2(v[1],v[0])/DEG, Math.asin(Math.max(-1,Math.min(1,v[2])))/DEG];}
function norm(v){const m=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/m,v[1]/m,v[2]/m];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function rot(v,axis,angDeg){
  const t=angDeg*DEG,c=Math.cos(t),s=Math.sin(t);
  const d=v[0]*axis[0]+v[1]*axis[1]+v[2]*axis[2], cr=cross(axis,v);
  return [v[0]*c+cr[0]*s+axis[0]*d*(1-c),
          v[1]*c+cr[1]*s+axis[1]*d*(1-c),
          v[2]*c+cr[2]*s+axis[2]*d*(1-c)];
}
function plateCode(p){return p.Code||p.CODE||NAME2CODE[p.PlateName||p.NAME]||null;}
function rotateGeom(geom,axis,ang){
  const map=ring=>ring.map(([lon,lat])=>v2ll(rot(ll2v(lon,lat),axis,ang)));
  if(geom.type==='Polygon') return {type:'Polygon',coordinates:geom.coordinates.map(map)};
  if(geom.type==='MultiPolygon') return {type:'MultiPolygon',coordinates:geom.coordinates.map(pl=>pl.map(map))};
  return geom;
}

// 畫布 / 投影
const cv=document.getElementById('globe'), ctx=cv.getContext('2d');
let W,H,DPR=Math.min(2,window.devicePixelRatio||1);
const projection=d3.geoOrthographic().clipAngle(90).precision(0.4);
const path=d3.geoPath(projection,ctx);
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  projection.scale(Math.min(W,H)*0.42).translate([W/2,H/2]);
}
window.addEventListener('resize',()=>{resize();draw();});

// 狀態
let plates0=null, rotatedPlates=null;
let landParts=[], driftedLand=null;
let grid=null; const GRES=3, GLON=360/GRES, GLAT=180/GRES;
let t=0, lastCT=0, dir=1, playing=true, speed=4;
let showGhost=true, showPlates=false, showParticles=false, spin=true;
const TCLAMP=100, PGAIN=14, NP=2200, MAXAGE=140, TAIL=6;
let particles=[];

// 載入資料
const LAND='https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json';
const PLATES='https://cdn.jsdelivr.net/gh/fraxen/tectonicplates@master/GeoJSON/PB2002_plates.json';
Promise.all([d3.json(LAND), d3.json(PLATES)]).then(([lw,pl])=>{
  plates0=pl;
  plates0.features.forEach(f=>{
    const code=plateCode(f.properties);
    f.__code=code;
    f.__euler=code&&EULER[code]?EULER[code]:null;
    f.__hue=code?(code.charCodeAt(0)*37+code.charCodeAt(1)*13)%360:200;
  });
  buildGrid();
  // 把陸地拆成一塊塊大陸/島，各依「所在板塊」的 Euler 運動漂移（整塊旋轉不撕裂）
  // land-110m 的 objects.land 是 GeometryCollection → topojson.feature 回 FeatureCollection
  const lf=topojson.feature(lw,lw.objects.land);
  const feats=(lf.type==='FeatureCollection')?lf.features:[lf];
  landParts=[];
  for(const ft of feats){
    const g=ft.geometry; if(!g) continue;
    const polys=(g.type==='MultiPolygon')?g.coordinates:(g.type==='Polygon'?[g.coordinates]:[]);
    for(const poly of polys){
      const feat={type:'Feature',geometry:{type:'Polygon',coordinates:poly}};
      const c=d3.geoCentroid(feat), pl=plateAt(c[0],c[1]);
      feat.__euler=pl?pl.__euler:null;
      feat.__hue=pl?pl.__hue:200;
      landParts.push(feat);
    }
  }
  initParticles();
  resize();
  computePlates();
  computeLand();
  document.getElementById('loading').style.display='none';
  requestAnimationFrame(loop);
}).catch(err=>{
  document.getElementById('loading').style.display='none';
  const e=document.getElementById('err');e.style.display='flex';
  e.innerHTML='⚠️ 載入外部資料失敗（網路或 CDN 被擋）。需連到 jsDelivr。<br><small>'+(err&&err.message?err.message:err)+'</small>';
});

// 板塊查找網格（現今位置）
function buildGrid(){
  grid=new Array(GLON*GLAT).fill(null);
  for(let j=0;j<GLAT;j++){
    const lat=-90+(j+0.5)*GRES;
    for(let i=0;i<GLON;i++){
      const lon=-180+(i+0.5)*GRES, p=[lon,lat];
      for(const f of plates0.features){ if(d3.geoContains(f,p)){grid[j*GLON+i]=f;break;} }
    }
  }
}
function plateAt(lon,lat){
  let i=Math.floor((lon+180)/GRES), j=Math.floor((lat+90)/GRES);
  i=(i%GLON+GLON)%GLON; j=Math.max(0,Math.min(GLAT-1,j));
  return grid[j*GLON+i];
}
function velAt(lon,lat){
  const f=plateAt(lon,lat); if(!f||!f.__euler) return null;
  const e=f.__euler, axis=norm(ll2v(e[1],e[0])), w=e[2]*DEG, P=ll2v(lon,lat);
  return cross(axis.map(x=>x*w),P);
}

// 依時間 t 漂移
function computeLand(){
  driftedLand=landParts.map(f=>{
    if(!f.__euler||Math.abs(t)<1e-6) return f;
    const e=f.__euler, axis=norm(ll2v(e[1],e[0])), ang=e[2]*t;
    return {type:'Feature',geometry:rotateGeom(f.geometry,axis,ang),__hue:f.__hue};
  });
}
function computePlates(){
  if(!showPlates){rotatedPlates=null;return;}
  rotatedPlates=plates0.features.map(f=>{
    if(!f.__euler||Math.abs(t)<1e-6) return f;
    const e=f.__euler, axis=norm(ll2v(e[1],e[0])), ang=e[2]*t;
    return {type:'Feature',geometry:rotateGeom(f.geometry,axis,ang),__hue:f.__hue};
  });
}

// 粒子
function spawn(p){
  for(let k=0;k<12;k++){
    const lon=Math.random()*360-180, lat=Math.asin(Math.random()*2-1)/DEG;
    if(plateAt(lon,lat)){p.lon=lon;p.lat=lat;p.age=Math.random()*MAXAGE;p.tail=[];return;}
  }
  p.lon=0;p.lat=0;p.age=0;p.tail=[];
}
function initParticles(){particles=[];for(let i=0;i<NP;i++){const p={};spawn(p);particles.push(p);}}
function stepParticles(dt){
  const adv=PGAIN*speed*dir*dt;
  for(const p of particles){
    p.age++;
    if(p.age>MAXAGE){spawn(p);continue;}
    const v=velAt(p.lon,p.lat); if(!v){spawn(p);continue;}
    const P=ll2v(p.lon,p.lat), Pn=norm([P[0]+v[0]*adv,P[1]+v[1]*adv,P[2]+v[2]*adv]), ll=v2ll(Pn);
    p.tail.push([p.lon,p.lat]); if(p.tail.length>TAIL)p.tail.shift();
    p.lon=ll[0];p.lat=ll[1];p.spd=Math.hypot(v[0],v[1],v[2]);
  }
}

// 繪製
const center=()=>{const r=projection.rotate();return [-r[0],-r[1]];};
function visible(lon,lat){return d3.geoDistance([lon,lat],center())<Math.PI/2;}
function draw(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W/2,H*0.42,10,W/2,H*0.42,Math.max(W,H)*0.75);
  bg.addColorStop(0,'#0a1120');bg.addColorStop(1,'#05070d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 海洋球體
  ctx.beginPath();path({type:'Sphere'});
  const og=ctx.createRadialGradient(W/2-40,H*0.42-40,20,W/2,H*0.42,projection.scale());
  og.addColorStop(0,'#12305a');og.addColorStop(1,'#081832');
  ctx.fillStyle=og;ctx.fill();
  // 經緯網
  ctx.beginPath();path(d3.geoGraticule10());
  ctx.strokeStyle='rgba(120,150,200,.09)';ctx.lineWidth=0.6;ctx.stroke();
  // 板塊邊界（選用，淡）
  if(showPlates&&rotatedPlates){
    ctx.lineWidth=0.9;
    for(const f of rotatedPlates){ctx.beginPath();path(f);
      ctx.strokeStyle=`hsla(${f.__hue},70%,62%,.32)`;ctx.stroke();}
  }
  // 現今對照（灰白虛線）
  if(showGhost){
    ctx.save();ctx.setLineDash([3,3]);ctx.lineWidth=0.8;
    for(const f of landParts){ctx.beginPath();path(f);
      ctx.fillStyle='rgba(120,140,180,.05)';ctx.fill();
      ctx.strokeStyle='rgba(160,180,220,.45)';ctx.stroke();}
    ctx.restore();
  }
  // 漂移後大陸（彩色實體）
  if(driftedLand){
    for(const f of driftedLand){ctx.beginPath();path(f);
      ctx.fillStyle=`hsla(${f.__hue},48%,44%,.55)`;ctx.fill();
      ctx.strokeStyle=`hsla(${f.__hue},82%,72%,.95)`;ctx.lineWidth=1.1;
      ctx.shadowColor=`hsla(${f.__hue},90%,60%,.5)`;ctx.shadowBlur=5;ctx.stroke();ctx.shadowBlur=0;}
  }
  // 粒子（選用，暖黃）
  if(showParticles){
    ctx.lineWidth=1.1;ctx.lineCap='round';
    for(const p of particles){
      if(p.tail.length<2||!visible(p.lon,p.lat))continue;
      const pts=p.tail.concat([[p.lon,p.lat]]);
      for(let k=1;k<pts.length;k++){
        if(!visible(pts[k-1][0],pts[k-1][1]))continue;
        const s=projection(pts[k-1]),e=projection(pts[k]); if(!s||!e)continue;
        const al=(k/pts.length)*Math.min(1,(p.spd||0)*60+0.25);
        ctx.strokeStyle=`hsla(45,95%,72%,${al})`;
        ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(e[0],e[1]);ctx.stroke();
      }
    }
  }
}

// 主迴圈
let last=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000)||0.016; last=now;
  if(spin&&!dragging){const r=projection.rotate();projection.rotate([r[0]+2*dt,r[1],r[2]]);}
  if(playing){
    const nt=Math.max(-TCLAMP,Math.min(TCLAMP,t+dir*speed*dt));
    if(nt!==t){t=nt; if(t===0||Math.abs(t-lastCT)>0.3){computeLand();computePlates();lastCT=t;}}
    if(showParticles) stepParticles(dt);
  }
  draw();updateHUD();
  requestAnimationFrame(loop);
}
function updateHUD(){
  document.getElementById('ttime').textContent=(t>=0?'+':'')+t.toFixed(1)+' Myr';
  document.getElementById('tsub').textContent=
    Math.abs(t)<0.05?'現今 present day':(t>0?'未來 future（＋'+t.toFixed(0)+'百萬年）':'過去 past（'+t.toFixed(0)+'百萬年）');
}

// 互動：拖曳旋轉、滾輪縮放
let dragging=false,px,py,rot0;
cv.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;rot0=projection.rotate();cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const k=0.26;
  projection.rotate([rot0[0]+(e.clientX-px)*k, rot0[1]-(e.clientY-py)*k, rot0[2]]);});
cv.addEventListener('pointerup',()=>{dragging=false;});
cv.addEventListener('pointercancel',()=>{dragging=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();
  const s=projection.scale()*(e.deltaY<0?1.08:1/1.08);
  projection.scale(Math.max(Math.min(W,H)*0.25,Math.min(Math.min(W,H)*1.6,s)));},{passive:false});

// 控制列
const $=id=>document.getElementById(id);
function setDir(d){dir=d;playing=true;$('play').textContent='⏸';
  $('fwd').classList.toggle('on',d>0);$('back').classList.toggle('on',d<0);}
$('fwd').onclick=()=>setDir(1);
$('back').onclick=()=>setDir(-1);
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸':'▶';};
$('reset').onclick=()=>{t=0;computeLand();computePlates();};
$('speed').oninput=e=>{speed=+e.target.value;$('spv').textContent=speed.toFixed(1);};
$('tgGhost').onchange=e=>{showGhost=e.target.checked;};
$('tgPlates').onchange=e=>{showPlates=e.target.checked;computePlates();};
$('tgParticles').onchange=e=>{showParticles=e.target.checked;};
$('tgSpin').onchange=e=>{spin=e.target.checked;};
</script>
</body>
</html>
