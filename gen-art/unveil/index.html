  <style>
    :root{ --gold:#e9c46a; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ margin:0; min-height:100%; color:#eef2ea; background:radial-gradient(circle at 50% 8%, #1b2b3f, #070c14);
      font-family:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif; user-select:none; overflow-x:hidden; }
    .wrap{ max-width:520px; margin:0 auto; padding:8px 10px 24px; }
    .bar{ display:flex; align-items:center; gap:8px; }
    .bar a{ color:#9fc0b2; text-decoration:none; font-size:13px; }
    .bar h1{ font-size:17px; margin:0; } .bar .sp{ flex:1; }
    #hud{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:6px 0; }
    .pill{ background:#ffffff14; border:1px solid #ffffff22; border-radius:8px; padding:4px 10px; font-size:13px; }
    .pill b{ color:var(--gold); }
    .stage{ text-align:center; }
    #cv{ border:3px solid #24344a; border-radius:8px; background:#141c2b; box-shadow:0 8px 26px #000a; touch-action:none; }

    .controls{ display:flex; justify-content:center; margin-top:12px; }
    .dpad{ display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:6px; }
    .dpad button{ background:#ffffff18; border:1px solid #ffffff33; border-radius:12px; color:#eef2ea; font-size:22px; }
    .dpad button:active{ background:var(--gold); color:#3a2c00; }
    .dpad .e{ visibility:hidden; }

    #overlay{ position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; padding:16px; z-index:20; }
    #overlay.show{ display:flex; }
    .modal{ background:linear-gradient(#1a2b3f,#0c1826); border:1px solid var(--gold); border-radius:16px; padding:22px; max-width:460px; width:100%; text-align:center; box-shadow:0 24px 70px #000c; max-height:90vh; overflow:auto; }
    #ov-title{ font-size:21px; color:var(--gold); margin-bottom:10px; }
    #ov-body{ font-size:15px; color:#e6efe8; line-height:1.6; }
    #ov-actions{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
    .ovbtn{ background:var(--gold); color:#3a2c00; border:0; border-radius:10px; padding:11px 18px; font-size:15px; font-weight:700; cursor:pointer; }
    .fullart{ max-width:100%; max-height:66vh; border-radius:10px; box-shadow:0 10px 40px #000a; }
    #toast{ position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(16px); background:#0c1826ee; border:1px solid var(--gold);
      color:#fff; padding:9px 15px; border-radius:10px; font-size:14px; opacity:0; transition:.25s; z-index:30; pointer-events:none; }
    #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  <div class="wrap">

    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="controls">
      <div class="dpad">
        <button class="e"></button><button id="du">▲</button><button class="e"></button>
        <button id="dl">◀</button><button class="e"></button><button id="dr">▶</button>
        <button class="e"></button><button id="dd">▼</button><button class="e"></button>
      </div>
    </div>
  </div>
