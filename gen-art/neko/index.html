<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Neko — Generative Art</title>
  <meta name="description" content="自動養貓 gen-art。2~4 隻像素貓在一間寬廣的房間裡自由活動：睡覺、吃飯、玩耍、互動、跳上家具。攝影機自動切換主角，日夜循環，家具與毛色每次重整。移植自我自己寫的 ESP32-2432S028 (CYD) 電子養貓。">
  <meta name="author" content="kvzhuang">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0d1117;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, "Helvetica Neue", sans-serif;
    }
    main {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 100vw;
      height: calc(100vh - 52px);
    }
    main canvas { display: block; max-width: 100%; max-height: 100%; }
    #controls { display: flex; justify-content: center; gap: 12px; padding: 10px; }
    #controls button {
      padding: 12px 24px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; color: #fff;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #controls button:active { opacity: 0.7; }
    #btn-new   { background: #34C759; }
    #btn-speed { background: #FF9500; }
    #btn-zoom  { background: #5856D6; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <main id="neko-container"></main>
  <div id="controls">
    <button id="btn-new">New Room</button>
    <button id="btn-speed">Speed</button>
    <button id="btn-zoom">Zoom</button>
  </div>
  <script src="sketch.js?v=20260527a"></script>
</body>
</html>
