  <title>TSP — Traveling Salesman Problem</title>
  <meta name="description" content="Visualize the Traveling Salesman Problem solved step-by-step with nearest neighbor, 2-opt optimization, and simulated annealing.">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0d1117; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, 'Helvetica Neue', sans-serif; }
    main { display: flex; justify-content: center; align-items: center; }
    main canvas { display: block; }
    #controls {
      display: flex; justify-content: center; gap: 8px; padding: 8px; flex-wrap: wrap;
    }
    #controls button {
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #controls button:active { opacity: 0.7; }
    #btn-nn     { background: #3A86FF; }
    #btn-2opt   { background: #FF006E; }
    #btn-sa     { background: #8338EC; }
    #btn-new    { background: #2A9D8F; }
    #btn-save   { background: #457B9D; }
    #status {
      text-align: center; padding: 4px 8px; font-size: 12px; color: #8899AA; height: 20px;
    }
    #status span { color: #FFBE0B; font-weight: bold; }
  </style>
  <script id="fxhash-snippet">
    var alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ";
    var fxhash = "oo" + Array(49).fill(0).map(function(_){ return alphabet[(Math.random() * alphabet.length) | 0]; }).join("");
    var b58dec = function(str){ var p=0; for(var i=0;i<str.length;i++) p=p*alphabet.length+alphabet.indexOf(str[i]); return p; };
    var fxhashTrunc = fxhash.slice(2);
    var regex = new RegExp(".{" + ((fxhashTrunc.length / 4) | 0) + "}", "g");
    var hashes = fxhashTrunc.match(regex).map(function(h){ return b58dec(h); });
    var sfc32 = function(a,b,c,d){ return function(){ a|=0;b|=0;c|=0;d|=0; var t=(a+b|0)+d|0; d=d+1|0; a=b^(b>>>9); b=c+(c<<3)|0; c=(c<<21)|(c>>>11); c=c+t|0; return(t>>>0)/4294967296; }; };
    var fxrand = sfc32(hashes[0],hashes[1],hashes[2],hashes[3]);
    function fxpreview(){ window.dispatchEvent(new Event("fxhash-preview")); }
    window.$fxhashFeatures = {};
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

    <button id="btn-sa">Simulated Annealing</button>
    <button id="btn-new">New Cities</button>
    <button id="btn-save">Save</button>
