<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GP0KMK7NS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3GP0KMK7NS');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Particle Explosion — Generative Art</title>

  <meta name="description" content="互動式粒子爆炸動畫。點擊畫面觸發粒子爆炸、波紋擴散、螺旋漩渦等多種視覺效果，使用 anime.js 創造流暢動畫。">
  <meta name="author" content="kvzhuang">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a0f;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, "Helvetica Neue", sans-serif;
      cursor: crosshair;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 100;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 20px;
    }
    #controls button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    #controls button:hover { transform: scale(1.05); }
    #controls button:active { opacity: 0.7; }
    #btn-explosion { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    #btn-ripple { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    #btn-spiral { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    #btn-fountain { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    #btn-clear { background: #e74c3c; }
    
    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #666;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }
    #mode-name {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: #999;
      font-size: 12px;
      letter-spacing: 0.15em;
      pointer-events: none;
      z-index: 100;
    }
    
    @media (max-width: 640px) {
      #controls { bottom: 10px; gap: 8px; }
      #controls button { padding: 10px 18px; font-size: 13px; }
      #info { font-size: 12px; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
</head>
<body>
  <div id="info">點擊畫面或選擇效果模式</div>
  <div id="mode-name">EXPLOSION MODE</div>
  <div id="container"></div>
  <div id="controls">
    <button id="btn-explosion">💥 爆炸</button>
    <button id="btn-ripple">〰️ 波紋</button>
    <button id="btn-spiral">🌀 螺旋</button>
    <button id="btn-fountain">⛲ 噴泉</button>
    <button id="btn-clear">🗑️ 清空</button>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
