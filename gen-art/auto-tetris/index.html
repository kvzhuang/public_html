  <title>Auto Tetris — Generative Art</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a0f;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, "Helvetica Neue", sans-serif;
    }
    main { overflow: hidden; display: flex; justify-content: center; align-items: center; max-width: 100vw; max-height: calc(100vh - 52px); }
    main canvas { display: block; max-width: 100%; max-height: 100%; }
    #controls {
      display: flex; justify-content: center; gap: 12px; padding: 10px;
    }
    #controls button {
      padding: 12px 28px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; color: #fff;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #controls button:active { opacity: 0.7; }
    #btn-new   { background: #00f0f0; color: #111; }
    #btn-speed { background: #f0a000; color: #111; }
    #btn-save  { background: #457B9D; }
  </style>

  <script id="fxhash-snippet">
    var alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ";
    var fxhash = "oo" + Array(49).fill(0).map(function(_){ return alphabet[(Math.random() * alphabet.length) | 0]; }).join("");
    var b58dec = function(str) {
      var p = 0;
      for (var i = 0; i < str.length; i++) p = p * alphabet.length + alphabet.indexOf(str[i]);
      return p;
    };
    var fxhashTrunc = fxhash.slice(2);
    var regex = new RegExp(".{" + ((fxhashTrunc.length / 4) | 0) + "}", "g");
    var hashes = fxhashTrunc.match(regex).map(function(h){ return b58dec(h); });
    var sfc32 = function(a, b, c, d) {
      return function() {
        a |= 0; b |= 0; c |= 0; d |= 0;
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ (b >>> 9);
        b = c + (c << 3) | 0;
        c = (c << 21) | (c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      };
    };
    var fxrand = sfc32(hashes[0], hashes[1], hashes[2], hashes[3]);
    var isFxpreview = false;
    function fxpreview() { window.dispatchEvent(new Event("fxhash-preview")); }
    window.$fxhashFeatures = {};
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
