  <script id="fxhash-snippet">
    let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ";
    var fxhash = new URLSearchParams(window.location.search).get("fxhash");
    if (!fxhash) {
      fxhash = "oo" + Array(49).fill(0).map(function() {
        return alphabet[(Math.random() * alphabet.length) | 0];
      }).join("");
    }
    let b58dec = function(str) {
      return [...str].reduce(function(p, c) {
        return p * alphabet.length + alphabet.indexOf(c) | 0;
      }, 0);
    };
    let fxhashTrunc = fxhash.slice(2);
    let regex = new RegExp(".{" + ((fxhashTrunc.length / 4) | 0) + "}", "g");
    let hashes = fxhashTrunc.match(regex).map(function(h) { return b58dec(h); });
    let sfc32 = function(a, b, c, d) {
      return function() {
        a |= 0; b |= 0; c |= 0; d |= 0;
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ (b >>> 9);
        b = c + (c << 3) | 0;
        c = (c << 21) | (c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      };
    };
    var fxrand = sfc32(hashes[0], hashes[1], hashes[2], hashes[3]);
    function fxpreview() {
      window.dispatchEvent(new Event("fxhash-preview"));
    }
    window.$fxhashFeatures = {};
  </script>
