  <meta charset="UTF-8">

  <title>Anime Timeline — Generative Art</title>
  <meta name="description" content="anime.js timeline demo. A 5x5 grid of squares goes through a 6-phase choreography: appear, rotate, pulse, wave, explode, collapse.">
  <meta name="author" content="kvzhuang">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0a0a0f; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "Helvetica Neue", sans-serif; }
    main { display: flex; justify-content: center; align-items: center; width: 100vw; height: calc(100vh - 60px); }
    #grid { display: grid; gap: 12px; width: min(80vw, 80vh - 60px); aspect-ratio: 1; }
    .box { width: 100%; aspect-ratio: 1; transform-origin: center; will-change: transform, background-color; border-radius: 4px; }
    #controls { display: flex; justify-content: center; gap: 12px; padding: 10px; }
    #controls button { padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #controls button:active { opacity: 0.7; }
    #btn-new { background: #ef476f; }
    #phase { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #888; font-size: 13px; letter-spacing: 0.15em; pointer-events: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
</head>
<body>
  <div id="phase"></div>
  <main><div id="grid"></div></main>
  <div id="controls"><button id="btn-new">Replay</button></div>
  <script src="sketch.js?v=20260515a"></script>
</body>
