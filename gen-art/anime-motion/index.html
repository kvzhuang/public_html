    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0a0a0f; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "Helvetica Neue", sans-serif; }

    #stage svg { width: 100%; height: 100%; display: block; }

    #btn-new { background: #FFBE0B; color: #1a1a2e; }
    #path-name { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #888; font-size: 13px; letter-spacing: 0.15em; pointer-events: none; }

  <div id="path-name"></div>
  <main>
    <div id="stage">
      <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
        <path id="path" d="" />
        <g id="particles"></g>
      </svg>
    </div>
  </main>
  <div id="controls"><button id="btn-new">New Path</button></div>
