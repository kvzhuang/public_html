<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GP0KMK7NS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3GP0KMK7NS');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Anime Loaders — Generative Art</title>
  <meta name="description" content="anime.js loader gallery. A 4x3 grid of randomly-assigned loading spinners drawn from a pool of 16 styles, each with its own palette.">
  <meta name="author" content="kvzhuang">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0a0a0f; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "Helvetica Neue", sans-serif; color: #ccc; }
    main { display: flex; justify-content: center; align-items: center; width: 100vw; height: calc(100vh - 60px); padding: 20px; }
    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      width: min(94vw, 94vh - 60px);
      aspect-ratio: 4 / 3;
    }
    @media (max-aspect-ratio: 1/1) {
      #grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); aspect-ratio: 3 / 4; }
    }
    .cell {
      position: relative;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cell-label {
      position: absolute;
      bottom: 6px;
      left: 0; right: 0;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
      pointer-events: none;
    }
    /* ── loader 內部公用樣式 ────────────────────────────────────── */
    .lr-row { display: flex; gap: 8%; align-items: center; justify-content: center; width: 60%; height: 100%; }
    .lr-col { display: flex; flex-direction: column; gap: 8%; align-items: center; justify-content: center; width: 100%; height: 60%; }
    .lr-dot { width: 22%; aspect-ratio: 1; border-radius: 50%; }
    .lr-bar { width: 12%; height: 50%; border-radius: 3px; transform-origin: center; }
    .lr-ball { width: 26%; aspect-ratio: 1; border-radius: 50%; }
    .lr-square { width: 36%; aspect-ratio: 1; border-radius: 4px; }
    .lr-svg { width: 56%; aspect-ratio: 1; display: block; }
    .lr-bar-track { width: 70%; height: 14%; border-radius: 7px; overflow: hidden; }
    .lr-bar-fill { height: 100%; border-radius: 7px; }
    .lr-orbit-wrap { position: relative; width: 60%; aspect-ratio: 1; }
    .lr-orbit-dot { position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; top: 0; left: 50%; margin-left: -11%; }
    .lr-orbit-dot-b { top: auto; bottom: 0; }
    .lr-orbit-dot-c { top: 50%; left: 0; margin-top: -11%; margin-left: 0; }
    .lr-orbit-dot-d { top: 50%; left: auto; right: 0; margin-top: -11%; margin-left: 0; }
    .lr-iris-wrap { position: relative; width: 60%; aspect-ratio: 1; }
    .lr-iris-ring { position: absolute; border-radius: 50%; }
    .lr-iris-ring-1 { width: 100%; height: 100%; top: 0; left: 0; }
    .lr-iris-ring-2 { width: 64%; height: 64%; top: 18%; left: 18%; }
    .lr-iris-ring-3 { width: 32%; height: 32%; top: 34%; left: 34%; }
    .lr-trail-wrap { position: relative; width: 70%; aspect-ratio: 1; }
    .lr-trail-dot { position: absolute; top: 50%; left: 50%; width: 14%; aspect-ratio: 1; border-radius: 50%; margin: -7% 0 0 -7%; }
    .lr-cross-bar { position: absolute; }
    .lr-cross-h { left: 20%; right: 20%; top: 45%; height: 10%; border-radius: 3px; }
    .lr-cross-v { top: 20%; bottom: 20%; left: 45%; width: 10%; border-radius: 3px; }
    .lr-snake { display: flex; gap: 4%; justify-content: center; width: 70%; height: 100%; align-items: center; }
    .lr-snake-dot { width: 9%; aspect-ratio: 1; border-radius: 50%; }
    .lr-ripple { position: absolute; border-radius: 50%; border-style: solid; border-width: 3px; top: 50%; left: 50%; transform-origin: center; }
    .lr-plusx-wrap { position: relative; width: 60%; aspect-ratio: 1; transform-origin: center; }
    .lr-pendulum-wrap { position: relative; width: 60%; aspect-ratio: 1; }
    .lr-pendulum-arm { position: absolute; top: 6%; left: 50%; width: 2px; height: 60%; background: rgba(255,255,255,0.18); transform-origin: top center; margin-left: -1px; }
    .lr-pendulum-bob { position: absolute; bottom: -16%; left: 50%; width: 22%; aspect-ratio: 1; border-radius: 50%; margin-left: -11%; }
    .lr-petal-wrap { position: relative; width: 60%; aspect-ratio: 1; }
    .lr-petal { position: absolute; left: 50%; top: 50%; width: 8%; height: 36%; border-radius: 4px; transform-origin: 50% 100%; margin-left: -4%; margin-top: -36%; }
    .lr-slide-bar { width: 60%; height: 8%; border-radius: 4px; transform-origin: center; }
    .lr-matrix-wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8%; width: 56%; aspect-ratio: 1; }
    .lr-matrix-dot { aspect-ratio: 1; border-radius: 50%; }
    #controls { display: flex; justify-content: center; gap: 12px; padding: 10px; }
    #controls button { padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    #controls button:active { opacity: 0.7; }
    #btn-new { background: #5390D9; }
    #title { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #888; font-size: 13px; letter-spacing: 0.15em; pointer-events: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
</head>
<body>
  <div id="title"></div>
  <main><div id="grid"></div></main>
  <div id="controls"><button id="btn-new">Reshuffle</button></div>
  <script src="sketch.js?v=20260515b"></script>
</body>
</html>
