<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>體素村莊 Voxel Village · 觀察模式</title>
  <meta name="description" content="three.js 體素世界觀察模式：小人自動挖方塊、蓋房子、逐步擴建，含晝夜循環，狀態存於 localStorage。">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root{
      --ink:#eaf2ff; --muted:#9fb3cc; --gold:#ffcf6b; --ok:#7fe6a1;
      --panel:rgba(10,16,28,.72); --line:rgba(255,255,255,.14);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;overflow:hidden;background:#0a1020;}
    body{font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);}
    #scene{position:fixed;inset:0;display:block;}
    .hud{position:fixed;pointer-events:none;z-index:5;}

    .topbar{
      top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;
      flex-wrap:wrap;justify-content:space-between;
    }
    .brand{
      pointer-events:auto;display:flex;align-items:baseline;gap:10px;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:8px 14px;backdrop-filter:blur(12px);box-shadow:0 12px 34px #0007;
    }
    .brand h1{margin:0;font-size:clamp(15px,2.2vw,20px);letter-spacing:.3px;white-space:nowrap;}
    .brand .en{color:var(--muted);font-size:12px;font-weight:600;}
    .clock{
      pointer-events:auto;display:flex;align-items:center;gap:10px;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:8px 14px;backdrop-filter:blur(12px);box-shadow:0 12px 34px #0007;
      font-variant-numeric:tabular-nums;font-weight:800;
    }
    .clock .sky{font-size:20px;line-height:1;}
    .clock .day{color:var(--gold);}
    .clock .hm{font-size:18px;}

    .controls{
      top:auto;bottom:12px;left:12px;right:12px;display:flex;gap:8px;
      align-items:center;flex-wrap:wrap;
    }
    .panelbox{
      pointer-events:auto;display:flex;align-items:center;gap:10px;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:8px 12px;backdrop-filter:blur(12px);box-shadow:0 12px 34px #0007;
    }
    .btn{
      pointer-events:auto;min-height:38px;padding:8px 12px;border-radius:10px;
      border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);
      font-weight:800;cursor:pointer;font-size:14px;transition:.14s;
    }
    .btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px);}
    .btn.gold{background:linear-gradient(180deg,#ffd980,#e0a63a);color:#1a1206;border-color:#ffe6a8;}
    .field{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;}
    input[type=range]{accent-color:var(--gold);width:130px;}
    .spd{color:var(--gold);font-weight:900;min-width:38px;text-align:right;}

    .log{
      bottom:64px;left:12px;width:min(340px,72vw);max-height:34vh;overflow:hidden;
      display:flex;flex-direction:column-reverse;gap:3px;
      font-size:12.5px;color:#cfe0f5;text-shadow:0 1px 3px #000a;
    }
    .log .row{background:rgba(8,14,26,.5);border-left:3px solid var(--ok);
      padding:3px 8px;border-radius:0 6px 6px 0;opacity:.94;}

    .hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;
      color:var(--muted);font-size:14px;text-align:center;pointer-events:none;opacity:.85;}

    @media (max-width:720px){
      .brand .en{display:none;}
      input[type=range]{width:92px;}
      .log{display:none;}
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud topbar">
    <div class="brand">
      <h1>🏘️ 體素村莊</h1>
      <span class="en">Voxel Village · 觀察模式</span>
    </div>
    <div class="clock">
      <span class="sky" id="skyIcon">☀️</span>
      <span class="day" id="dayText">第 1 天</span>
      <span class="hm" id="hmText">06:00</span>
    </div>
  </div>

  <div class="hud log" id="log"></div>

  <div class="hud controls">
    <div class="panelbox">
      <button class="btn" id="pauseBtn">⏸ 暫停</button>
      <div class="field">速度
        <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1">
        <span class="spd" id="spdText">1x</span>
      </div>
    </div>
    <div class="panelbox">
      <button class="btn" id="rotateBtn">🔄 自動旋轉：開</button>
      <button class="btn gold" id="resetBtn">🌱 新世界</button>
    </div>
  </div>

  <div class="hint" id="hint">拖曳可環顧四周 · 滾輪縮放</div>

  <script>
    (function(){
      var boot = function(){
        var s = document.createElement('script');
        s.src = 'voxel-village.js?v=' + Date.now();
        document.body.appendChild(s);
      };
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(boot, 0);
      } else {
        document.addEventListener('DOMContentLoaded', boot);
      }
    })();
  </script>
</body>
</html>
