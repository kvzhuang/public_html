<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GP0KMK7NS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3GP0KMK7NS');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>小丑對決 Joker Duel — Balatro 風 roguelike</title>
  <meta name="description" content="Balatro 風的撲克 roguelike run：Ante/盲注、星球牌升級牌型、塔羅消耗品、Boss 特殊規則、商店經濟、更多小丑與難度，對電腦競速攻頂，進度存 localStorage。">
  <meta name="author" content="kvzhuang">
  <meta name="theme-color" content="#14342b">
  <style>
    :root{ --felt2:#0e2620; --gold:#e9c46a; --card:#f7f3e8; --ink:#1c1c22; --red:#c0392b; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; background:radial-gradient(circle at 50% 12%, #1c4a3d, var(--felt2)); color:#eef2ea;
      font-family:"Noto Sans TC","Hiragino Sans",system-ui,sans-serif; }
    #game{ max-width:980px; margin:0 auto; padding:12px 14px 40px; }
    .top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:4px 2px 8px; border-bottom:1px solid #ffffff22; }
    .tag{ background:#ffffff14; border:1px solid #ffffff22; border-radius:8px; padding:5px 10px; font-size:13px; }
    .tag b{ color:var(--gold); }
    .sp{ flex:1; }
    .top button, .shop-bar button, .draft, .buy, .usebtn{ cursor:pointer; }
    #menu{ background:#ffffff18; color:#eef2ea; border:1px solid #ffffff33; border-radius:8px; padding:6px 12px; font-size:13px; }
    .boss{ margin:10px 0; padding:9px 12px; border-radius:10px; background:linear-gradient(#5a1e2a,#3a1420); border:1px solid #c65; font-size:14px; }
    .boss b{ color:#ffd0a0; }
    .prog{ margin:12px 0 6px; }
    .pbar{ height:16px; background:#00000040; border:1px solid #ffffff22; border-radius:10px; overflow:hidden; }
    .pfill{ height:100%; background:linear-gradient(90deg,#e76f51,var(--gold)); transition:width .3s; }
    .pnum{ text-align:center; font-size:13px; margin-top:5px; color:#dce7dd; }
    .pnum .tot,.tot{ color:var(--gold); }
    .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    .buy,.reroll,.next,.usebtn,.top button{ margin:3px; }
    .lbl{ font-size:12px; letter-spacing:.08em; color:#9fb6a9; min-width:96px; }
    .jk{ background:linear-gradient(#33465e,#25344a); border:1px solid #6f86a8; border-radius:9px; padding:5px 9px; min-width:90px; box-shadow:0 3px 8px #0006; }
    .jk{ position:relative; }
    .jk .jn{ position:absolute; top:-6px; left:-6px; background:var(--gold); color:#3a2c00; font-size:10px; font-weight:800; border-radius:50%; width:16px; height:16px; display:flex; align-items:center; justify-content:center; }
    .jk b{ display:block; font-size:12.5px; color:#ffe08a; }
    .jk span{ display:block; font-size:10px; color:#c7d3e6; line-height:1.3; }
    .selljk{ display:block; margin-top:5px; background:#c0563a; color:#fff; border:0; border-radius:6px; padding:2px 8px; font-size:10px; cursor:pointer; }
    .lv{ background:#1f3a30; border:1px solid #3f7a63; border-radius:8px; padding:4px 9px; font-size:12px; color:#dff0e6; }
    .lv b{ color:#8fe0b6; }
    .lv .tmp{ margin-left:6px; color:#ffb060; font-weight:700; }
    .rar{ font-size:10px; padding:1px 6px; border-radius:6px; vertical-align:middle; font-weight:700; }
    .rar-common{ background:#5a6b7a; color:#e8eef4; }
    .rar-uncommon{ background:#2f7d5e; color:#eafff2; }
    .rar-rare{ background:linear-gradient(#a067e0,#7a3fd0); color:#fff; }
    .jk.rar-b-uncommon{ border-color:#4fd0a0; box-shadow:0 0 0 1px #4fd0a066, 0 3px 8px #0006; }
    .jk.rar-b-rare{ border-color:#c79cff; box-shadow:0 0 0 1px #c79cff88, 0 3px 10px #0007; }
    .draft.rar-b-uncommon{ border-color:#4fd0a0; }
    .draft.rar-b-rare{ border-color:#c79cff; box-shadow:0 0 12px #a067e055; }
    .cs{ background:linear-gradient(#3a3055,#281f40); border:1px solid #9b83c8; border-radius:9px; padding:5px 9px; min-width:110px; }
    .cs b{ display:block; font-size:12.5px; color:#e0c8ff; }
    .cs span{ display:block; font-size:10px; color:#cbbde6; line-height:1.3; }
    .usebtn{ margin-top:4px; background:var(--gold); color:#3a2c00; border:0; border-radius:6px; padding:3px 8px; font-size:11px; }
    .row i{ color:#7f948a; font-size:12px; }
    .preview{ text-align:center; font-size:16px; color:#dfeae0; margin:8px 0; min-height:22px; }
    .preview b{ color:#fff; }
    .hand{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; min-height:104px; margin-top:4px; }
    .card{ width:62px; height:90px; background:var(--card); color:var(--ink); border-radius:9px; position:relative; cursor:pointer;
      box-shadow:0 4px 10px #0007; border:2px solid transparent; transition:transform .08s, border-color .08s;
      display:flex; flex-direction:column; justify-content:space-between; padding:6px 7px; user-select:none; }
    .card.red{ color:var(--red); }
    .card:hover{ transform:translateY(-4px); }
    .card.sel{ transform:translateY(-14px); border-color:var(--gold); box-shadow:0 10px 18px #0009; }
    .card.deb{ filter:grayscale(1) brightness(.7); }
    .card .r{ font-size:19px; font-weight:800; }
    .card .s{ font-size:23px; align-self:flex-end; line-height:1; }
    .card .enh{ position:absolute; top:2px; right:4px; font-size:10px; background:#2a9d8f; color:#fff; border-radius:4px; padding:0 3px; }
    .cardshow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
    .mini{ display:inline-flex; align-items:center; background:var(--card); color:var(--ink); border-radius:7px; padding:8px 12px; font-weight:800; font-size:18px; box-shadow:0 3px 10px #0007; }
    .mini.red{ color:var(--red); }
    .mini .enh{ position:static; margin-left:6px; font-size:11px; background:#2a9d8f; color:#fff; border-radius:5px; padding:1px 5px; }
    .controls{ display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:20px; }
    .controls button{ border:0; border-radius:10px; padding:10px 18px; font-size:15px; font-weight:700; }
    .play{ background:var(--gold); color:#3a2c00; }
    .discard{ background:#c0563a; color:#fff; }
    .sort{ background:#ffffff1c; color:#eef2ea; font-weight:500; font-size:13px; padding:8px 12px; }
    .controls button:disabled{ opacity:.4; cursor:not-allowed; }
    .cnts{ font-size:13px; color:#cdd9cf; }
    .flash{ text-align:center; font-size:14px; color:#eaf3ea; margin-top:8px; min-height:20px; }
    .hint{ font-size:12px; color:#8fa89a; text-align:center; margin-top:16px; line-height:1.7; }
    .shop-title,.start-title{ text-align:center; font-size:22px; color:var(--gold); margin:14px 0 6px; }
    .start-sub{ text-align:center; font-size:13px; color:#b9c8bd; margin-bottom:14px; }
    .shop-grid{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin:16px 0; }
    .shop-item{ width:180px; background:linear-gradient(#183a30,#12291f); border:1px solid #ffffff26; border-radius:12px; padding:12px; text-align:center; }
    .shop-item.sold{ opacity:.4; display:flex; align-items:center; justify-content:center; color:#9fb6a9; }
    .si-n{ font-size:15px; font-weight:700; color:#ffe08a; }
    .si-d{ font-size:11.5px; color:#c7d3c9; margin:6px 0 8px; min-height:32px; line-height:1.4; }
    .si-p{ font-size:14px; color:var(--gold); margin-bottom:8px; }
    .buy{ background:var(--gold); color:#3a2c00; border:0; border-radius:8px; padding:6px 16px; font-weight:700; }
    .buy:disabled{ opacity:.4; cursor:not-allowed; }
    .shop-bar,.start-box{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
    .reroll{ background:#ffffff1c; color:#eef2ea; border:0; border-radius:10px; padding:10px 16px; font-weight:600; }
    .reroll:disabled{ opacity:.4; }
    .next{ background:#2a9d8f; color:#fff; border:0; border-radius:10px; padding:10px 18px; font-weight:700; }
    #overlay{ position:fixed; inset:0; background:#000b; display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
    #overlay.show{ display:flex; }
    .modal{ background:linear-gradient(#183a30,#0f2620); border:1px solid var(--gold); border-radius:16px; padding:24px 26px; max-width:520px; text-align:center; box-shadow:0 20px 60px #000b; }
    #ov-title{ font-size:24px; color:var(--gold); margin-bottom:8px; }
    #ov-body{ font-size:15px; color:#e6efe8; line-height:1.6; }
    #ov-actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:20px; }
    .draft{ background:linear-gradient(#33465e,#25344a); border:1px solid #6f86a8; color:#ffe08a; border-radius:12px; padding:12px 18px; font-size:15px; margin:2px; }
    .draft:hover{ border-color:var(--gold); }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="overlay"><div class="modal"><div id="ov-title"></div><div id="ov-body"></div><div id="ov-actions"></div></div></div>
  <script>
    // 以時間戳破快取，確保每次載入都是最新的 game.js
    (function(){ var s = document.createElement('script'); s.src = 'game.js?v=' + Date.now(); document.body.appendChild(s); })();
  </script>
</body>
</html>
