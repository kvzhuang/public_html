<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GP0KMK7NS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3GP0KMK7NS');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Question Storm — Generative Art</title>
  <meta name="description" content="anime.js generative art recreating the '滿頭問號 / WTF' animated sticker effect. 5-stage escalation: 1 → 3 → 12 → 150+ question marks flood the screen.">
  <meta name="author" content="kvzhuang">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: "Georgia", "Times New Roman", serif;
      background: #f0eee6;
      transition: background 0.4s ease;
    }
    main {
      width: 100vw;
      height: calc(100vh - 60px);
      position: relative;
      overflow: hidden;
    }
    /* wrapper: 只做定位（不被 anime 觸碰） */
    .qwrap {
      position: absolute;
      transform: translate(-50%, -50%);
      user-select: none;
      pointer-events: none;
    }
    /* inner: anime 在這層管 scale/rotate/opacity/filter，不會破壞 wrapper 的 translate */
    .qmark {
      display: inline-block;
      font-weight: 900;
      line-height: 1;
      will-change: transform, opacity, filter;
      transform-origin: center center;
      opacity: 0;          /* CSS 初始隱形，anime 之後動到 1 */
      transform: scale(0); /* CSS 初始 scale 0 */
    }
    #controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      background: rgba(0,0,0,0.04);
    }
    #controls button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #controls button:active { opacity: 0.7; }
    #btn-new { background: #1a1a1a; }
    #title {
      position: fixed;
      top: 12px;
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.15em;
      pointer-events: none;
      opacity: 0.4;
      font-family: -apple-system, "Helvetica Neue", sans-serif;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
</head>
<body>
  <div id="title"></div>
  <main id="stage"></main>
  <div id="controls"><button id="btn-new">Replay</button></div>
  <script src="sketch.js?v=20260521k"></script>
</body>
</html>
