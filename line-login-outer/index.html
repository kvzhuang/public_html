<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open LINE LIFF</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;
      background: #f4f7f9;
      color: #1a1a1a;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      background: #fff;
      border-top: 5px solid #06c755;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 13px;
      border-radius: 8px;
      background: #06c755;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 1.3rem;
      font-weight: 650;
    }
    .open-link {
      display: block;
      width: 100%;
      border-radius: 999px;
      background: #06c755;
      color: #fff;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .open-link:active { opacity: 0.72; }
    .target {
      margin-top: 18px;
      color: #777;
      font-family: -apple-system, "SF Mono", "Menlo", monospace;
      font-size: 0.78rem;
      word-break: break-all;
      text-align: left;
    }
  </style>
</head>
<body>
  <main class="panel">
    <span class="logo">LINE</span>
    <h1>開啟 LINE LIFF</h1>
    <a class="open-link" href="https://liff.line.me/2010014916-P9Zg6UTA">開啟 LINE 登入</a>
    <div class="target">目標 LIFF URL: https://liff.line.me/2010014916-P9Zg6UTA</div>
  </main>
</body>
</html>
